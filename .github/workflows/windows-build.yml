name: Windows desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build (tests run first; build aborts on failure)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File desktop\build_windows.ps1
      - name: Launch smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\FinancialIntelligenceV7.exe -ArgumentList "--no-browser","--port","8555" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 1
            try { if ((Invoke-WebRequest http://127.0.0.1:8555/_stcore/health -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Get-Process FinancialIntelligenceV7 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "Executable did not become healthy" }
      - uses: actions/upload-artifact@v4
        with:
          name: FinancialIntelligenceV7-windows
          path: dist/FinancialIntelligenceV7.exe
      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FinancialIntelligenceV7.exe
