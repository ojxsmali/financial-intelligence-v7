name: Refresh bundled data snapshots

# The running app refreshes listings (24 h) and filings (12 h) on its own. These bundled
# snapshots are only the fallback for hosts where SEC blocks requests or the network is down.
on:
  schedule:
    - cron: "17 11 * * 1-5"   # weekdays 11:17 UTC, after Nasdaq Trader's overnight files
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh listings, SEC profiles (incremental) and financial snapshot
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          FIP_CACHE_DIR: ${{ runner.temp }}/fip-cache
        run: |
          if [ -z "$SEC_CONTACT_EMAIL" ]; then
            echo "Repository secret SEC_CONTACT_EMAIL is not set; skipping."; exit 0
          fi
          python scripts/refresh_universe.py
          python scripts/build_sec_profiles.py
          python scripts/refresh_universe.py
          python scripts/refresh_financials_snapshot.py
      - name: Run tests against refreshed data
        env:
          FIP_OFFLINE: "1"
        run: pip install pytest && python -m pytest -q -p no:cacheprovider
      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh bundled SEC / listing snapshots"
          git push
