[server]
headless = true
runOnSave = false
maxUploadSize = 1          # MB — CSV uploads are validated again server-side
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"  # never render stack traces to visitors

[logger]
level = "warning"

[theme]
# "Research paper" design system — tokens mirrored in fip/ui/theme.py
base = "light"
primaryColor = "#1D3B5A"
backgroundColor = "#F5F3EE"
secondaryBackgroundColor = "#ECE8E0"
textColor = "#16181B"
linkColor = "#1D3B5A"
borderColor = "#D8D3C8"
dataframeBorderColor = "#D8D3C8"
dataframeHeaderBackgroundColor = "#F5F3EE"
codeBackgroundColor = "#ECE8E0"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap, serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#1F6FB8", "#D4602C", "#16956A", "#B07A00", "#C2507F", "#6A4FB0"]

[theme.sidebar]
backgroundColor = "#EFECE5"
secondaryBackgroundColor = "#E6E2D9"
